[project]
name = "callmate-pipeline"
version = "0.1.0"
description = "CallMate call pipeline: telephony, audio, STT/TTS, turn-taking"
requires-python = ">=3.12"
dependencies = [
    "callmate-contracts",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "websockets>=13.1",
    "httpx>=0.27",
    "audioop-lts>=0.2; python_version >= '3.13'",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24"]

[tool.uv.sources]
callmate-contracts = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callmate_pipeline"]
