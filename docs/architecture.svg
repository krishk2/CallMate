<svg viewBox="0 0 1680 1210" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1b2430"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1680" height="1210" fill="#f6f4ee"/>

  <text x="40" y="44" font-size="26" font-weight="700" fill="#1b2430">CallMate: how a call actually moves</text>
  <text x="40" y="70" font-size="14" fill="#4a5568">Two services we own (pipeline, brain) between a phone call and nine third-party APIs &mdash; every arrow is a real, live hop, labeled with its actual protocol.</text>

  <g transform="translate(0,90)">
    <!-- connectors -->
    <g fill="none" stroke="#1b2430" stroke-width="1.6">
      <line x1="172" y1="130" x2="246" y2="130" marker-end="url(#arrow)"/>

      <line x1="442" y1="92"  x2="518" y2="92"  marker-end="url(#arrow)"/>
      <line x1="518" y1="130" x2="442" y2="130" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
      <line x1="442" y1="168" x2="518" y2="168" marker-end="url(#arrow)"/>
      <line x1="518" y1="172" x2="442" y2="172" marker-end="url(#arrow)"/>

      <path d="M560 212 V240 H442" marker-end="url(#arrow)"/>
      <line x1="613" y1="28" x2="613" y2="58" stroke-dasharray="5 4" marker-end="url(#arrow)"/>

      <line x1="712" y1="130" x2="798" y2="130" marker-end="url(#arrow)"/>
      <line x1="798" y1="150" x2="712" y2="150" marker-end="url(#arrow)"/>

      <path d="M655 58 V14 H1295 V58" marker-end="url(#arrow)"/>

      <path d="M560 212 L560 236 L540 236 L540 260" marker-end="url(#arrow)"/>
      <path d="M672 212 L672 236 L700 236 L700 260" marker-end="url(#arrow)"/>

      <path d="M900 212 L900 236 L880 236 L880 260" marker-end="url(#arrow)"/>
      <path d="M970 212 L970 236 L1000 236 L1000 260" marker-end="url(#arrow)"/>

      <path d="M818 212 L818 420 L878 420" marker-end="url(#arrow)"/>
      <path d="M1052 212 L1052 420 L1002 420" marker-end="url(#arrow)"/>
    </g>

    <!-- labels -->
    <g font-size="11.5" fill="#1b2430">
      <text x="209" y="122" text-anchor="middle">PSTN</text>

      <text x="480" y="84" text-anchor="middle">REST &middot; HTTPS</text>
      <text x="480" y="97" text-anchor="middle">POST /twilio/voice &rarr; TwiML</text>

      <text x="480" y="148" text-anchor="middle" opacity="0.85">REST &middot; Calls.create()</text>
      <text x="480" y="160" text-anchor="middle" opacity="0.85">outbound trigger</text>

      <text x="480" y="194" text-anchor="middle">WSS &middot; bidirectional</text>
      <text x="480" y="206" text-anchor="middle">&mu;-law 8kHz audio</text>

      <text x="500" y="233" text-anchor="middle" font-size="11">REST &middot; Messages API (WhatsApp)</text>

      <text x="650" y="42" text-anchor="middle">REST &middot; Bearer auth</text>
      <text x="613" y="24" text-anchor="middle" font-size="10.5" opacity="0.8">any client (Swagger UI)</text>

      <text x="755" y="122" text-anchor="middle">WSS &middot; /v1/calls/&#123;id&#125;/ws</text>
      <text x="755" y="166" text-anchor="middle" opacity="0.85">Bearer auth, JSON</text>

      <text x="975" y="10" text-anchor="middle" font-size="11">REST &middot; HTTPS &middot; Bot API (sendMessage)</text>

      <text x="553" y="247" text-anchor="middle" font-size="10.5">WSS &middot; STT</text>
      <text x="706" y="247" text-anchor="middle" font-size="10.5">WSS &middot; TTS</text>

      <text x="893" y="247" text-anchor="middle" font-size="10.5">REST &middot; chat</text>
      <text x="1013" y="247" text-anchor="middle" font-size="10.5">REST &middot; chat+embed</text>

      <text x="845" y="330" text-anchor="middle" font-size="10.5" transform="rotate(-90 845 330)">SQL &middot; asyncpg &middot; TLS</text>
      <text x="1085" y="330" text-anchor="middle" font-size="10.5" transform="rotate(-90 1085 330)">RESP &middot; TLS</text>
    </g>

    <!-- nodes -->
    <g transform="translate(30,90)">
      <rect width="142" height="80" rx="10" fill="#ffffff" stroke="#1b2430" stroke-width="1.4"/>
      <circle cx="26" cy="26" r="11" fill="none" stroke="#1b2430" stroke-width="1.6"/>
      <path d="M20 23 q6 -5 12 0 M22 27 q4 -3 8 0" fill="none" stroke="#1b2430" stroke-width="1.4"/>
      <text x="71" y="50" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b2430">Caller's</text>
      <text x="71" y="65" text-anchor="middle" font-size="13.5" font-weight="600" fill="#1b2430">phone</text>
    </g>

    <g transform="translate(250,60)">
      <rect width="192" height="150" rx="10" fill="#ffffff" stroke="#1b2430" stroke-width="1.4"/>
      <rect x="0" y="0" width="192" height="5" rx="2.5" fill="#f22f46"/>
      <rect x="14" y="16" width="20" height="20" rx="5" fill="#f22f46" opacity="0.16"/>
      <path d="M19 26 a5 5 0 1 1 10 0 a5 5 0 1 1 -10 0" fill="none" stroke="#f22f46" stroke-width="1.6"/>
      <text x="40" y="30" font-size="14.5" font-weight="700" fill="#1b2430">Twilio</text>
      <text x="14" y="52" font-size="11" fill="#4a5568">Programmable Voice</text>
    </g>

    <g transform="translate(250,232)">
      <rect width="192" height="40" rx="8" fill="#ffffff" stroke="#1b2430" stroke-width="1.2" stroke-dasharray="4 3"/>
      <circle cx="22" cy="20" r="7" fill="#f22f46" opacity="0.18"/>
      <path d="M18 22 l3 3 7 -8" fill="none" stroke="#f22f46" stroke-width="1.6"/>
      <text x="38" y="24" font-size="12" font-weight="600" fill="#1b2430">Twilio &middot; Messages (WhatsApp)</text>
    </g>

    <g transform="translate(520,60)">
      <rect width="192" height="150" rx="10" fill="#e4efee" stroke="#2a6f6f" stroke-width="1.8"/>
      <rect x="14" y="16" width="22" height="18" rx="3" fill="none" stroke="#2a6f6f" stroke-width="1.6"/>
      <line x1="14" y1="22" x2="36" y2="22" stroke="#2a6f6f" stroke-width="1.2"/>
      <line x1="18" y1="28" x2="24" y2="28" stroke="#2a6f6f" stroke-width="1.2"/>
      <text x="42" y="30" font-size="14.5" font-weight="700" fill="#1b2430">pipeline</text>
      <text x="14" y="52" font-size="11" fill="#4a5568">telephony &middot; STT/TTS &middot; turn-taking</text>
      <text x="14" y="128" font-size="10.5" fill="#4a5568">FastAPI &middot; Fly.io &middot; sin</text>
    </g>

    <g transform="translate(800,60)">
      <rect width="350" height="150" rx="10" fill="#e4efee" stroke="#2a6f6f" stroke-width="1.8"/>
      <rect x="14" y="16" width="22" height="18" rx="3" fill="none" stroke="#2a6f6f" stroke-width="1.6"/>
      <line x1="14" y1="22" x2="36" y2="22" stroke="#2a6f6f" stroke-width="1.2"/>
      <line x1="18" y1="28" x2="24" y2="28" stroke="#2a6f6f" stroke-width="1.2"/>
      <text x="42" y="30" font-size="14.5" font-weight="700" fill="#1b2430">brain</text>
      <text x="14" y="52" font-size="11" fill="#4a5568">persona &middot; memory &middot; priority &middot; safety</text>
      <text x="14" y="128" font-size="10.5" fill="#4a5568">FastAPI &middot; Fly.io &middot; sin</text>
    </g>

    <g transform="translate(1210,60)">
      <rect width="170" height="150" rx="10" fill="#ffffff" stroke="#1b2430" stroke-width="1.4"/>
      <rect x="0" y="0" width="170" height="5" rx="2.5" fill="#2aa3dc"/>
      <circle cx="25" cy="26" r="11" fill="#2aa3dc" opacity="0.16"/>
      <path d="M19 28 l5 -8 9 -3 -4 9 -4 2 -2 4 z" fill="#2aa3dc"/>
      <text x="44" y="30" font-size="14.5" font-weight="700" fill="#1b2430">Telegram</text>
      <text x="14" y="52" font-size="11" fill="#4a5568">Bot API, notify-only</text>
    </g>

    <g transform="translate(440,260)">
      <rect width="170" height="86" rx="9" fill="#ffffff" stroke="#1b2430" stroke-width="1.3"/>
      <rect x="0" y="0" width="170" height="4" rx="2" fill="#6366f1"/>
      <polyline points="14,46 20,38 26,50 32,32 38,54 44,42" fill="none" stroke="#6366f1" stroke-width="1.8"/>
      <text x="14" y="28" font-size="13" font-weight="700" fill="#1b2430">Deepgram</text>
      <text x="14" y="70" font-size="10.5" fill="#4a5568">Flux STT &middot; streaming</text>
    </g>

    <g transform="translate(630,260)">
      <rect width="170" height="86" rx="9" fill="#ffffff" stroke="#1b2430" stroke-width="1.3"/>
      <rect x="0" y="0" width="170" height="4" rx="2" fill="#55606e"/>
      <polyline points="14,42 20,42 26,30 32,54 38,42 44,42" fill="none" stroke="#55606e" stroke-width="1.8"/>
      <text x="14" y="28" font-size="13" font-weight="700" fill="#1b2430">ElevenLabs</text>
      <text x="14" y="70" font-size="10.5" fill="#4a5568">TTS &middot; streaming, cloned voice</text>
    </g>

    <g transform="translate(800,260)">
      <rect width="162" height="86" rx="9" fill="#ffffff" stroke="#1b2430" stroke-width="1.3"/>
      <rect x="0" y="0" width="162" height="4" rx="2" fill="#f97316"/>
      <path d="M16 54 L28 34 L24 34 L36 32" fill="none" stroke="#f97316" stroke-width="2"/>
      <text x="14" y="28" font-size="13" font-weight="700" fill="#1b2430">Groq</text>
      <text x="14" y="70" font-size="10.5" fill="#4a5568">reply LLM, latency-critical</text>
    </g>

    <g transform="translate(972,260)">
      <rect width="178" height="86" rx="9" fill="#ffffff" stroke="#1b2430" stroke-width="1.3"/>
      <rect x="0" y="0" width="178" height="4" rx="2" fill="#5a9216"/>
      <rect x="14" y="34" width="18" height="18" rx="3" fill="none" stroke="#5a9216" stroke-width="1.8"/>
      <circle cx="23" cy="43" r="4" fill="#5a9216"/>
      <text x="40" y="28" font-size="13" font-weight="700" fill="#1b2430">NVIDIA NIM</text>
      <text x="14" y="70" font-size="10.5" fill="#4a5568">summary LLM + embeddings</text>
    </g>

    <g transform="translate(798,420)">
      <ellipse cx="80" cy="14" rx="80" ry="14" fill="#1f9d6c" opacity="0.14" stroke="#1b2430" stroke-width="1.3"/>
      <path d="M0,14 V86 A80,14 0 0 0 160,86 V14" fill="#ffffff" stroke="#1b2430" stroke-width="1.3"/>
      <ellipse cx="80" cy="14" rx="80" ry="14" fill="#1f9d6c" opacity="0.14" stroke="#1b2430" stroke-width="1.3"/>
      <text x="80" y="48" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2430">Neon Postgres</text>
      <text x="80" y="64" text-anchor="middle" font-size="10.5" fill="#4a5568">+ pgvector &middot; persistent</text>
    </g>

    <g transform="translate(998,420)">
      <path d="M0,14 V86 A80,14 0 0 0 160,86 V14" fill="#ffffff" stroke="#1b2430" stroke-width="1.3"/>
      <ellipse cx="80" cy="14" rx="80" ry="14" fill="#dc2626" opacity="0.14" stroke="#1b2430" stroke-width="1.3"/>
      <text x="80" y="48" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1b2430">Upstash Redis</text>
      <text x="80" y="64" text-anchor="middle" font-size="10.5" fill="#4a5568">repeat-call counter, TTL</text>
    </g>
  </g>

  <!-- legend -->
  <g transform="translate(40,1000)" font-size="12.5" fill="#4a5568">
    <line x1="0" y1="7" x2="26" y2="7" stroke="#1b2430" stroke-width="1.6" marker-end="url(#arrow)"/>
    <text x="34" y="11">primary call-path hop</text>

    <line x1="240" y1="7" x2="266" y2="7" stroke="#1b2430" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="274" y="11">secondary / triggered</text>

    <rect x="470" y="0" width="16" height="16" rx="3" fill="#e4efee" stroke="#2a6f6f"/>
    <text x="494" y="11">our service</text>

    <rect x="630" y="0" width="16" height="16" rx="3" fill="#ffffff" stroke="#1b2430" stroke-width="1.2"/>
    <text x="654" y="11">third-party API</text>

    <ellipse cx="825" cy="4" rx="8" ry="3" fill="#ffffff" stroke="#1b2430" stroke-width="1"/>
    <path d="M817,4 V10 A8,3 0 0 0 833,10 V4" fill="none" stroke="#1b2430" stroke-width="1"/>
    <text x="845" y="11">datastore</text>
  </g>

  <text x="40" y="1050" font-size="12.5" fill="#1b2430" font-weight="600">Reading it:</text>
  <text x="40" y="1072" font-size="12.5" fill="#4a5568">Twilio and pipeline have three distinct relationships, not one generic link &mdash; an inbound webhook that sets up the call, an outbound REST call</text>
  <text x="40" y="1092" font-size="12.5" fill="#4a5568">that triggers one (the India outbound-ISD workaround), and the actual bidirectional audio stream. Brain never touches Twilio, Deepgram, or</text>
  <text x="40" y="1112" font-size="12.5" fill="#4a5568">ElevenLabs directly &mdash; pipeline is the only thing that speaks telephony; brain only ever reasons and remembers.</text>

  <text x="40" y="1160" font-size="11" fill="#4a5568" font-style="italic">Icons are generic stylized marks (color + simple glyph), not the services' official logo artwork.</text>
  <text x="40" y="1180" font-size="11" fill="#4a5568" font-style="italic">Generated 2026-11-20 &middot; docs/architecture.svg</text>
</svg>
