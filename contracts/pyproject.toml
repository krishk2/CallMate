[project]
name = "callmate-contracts"
version = "1.0.0"
description = "Shared WebSocket/REST message schemas for CallMate pipeline <-> brain"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/callmate_contracts"]
